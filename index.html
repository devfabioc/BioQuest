<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08152f">
    <title>BioQuest — Ciências & Biologia</title>

    <style>
        :root{
            --bg:#061126;
            --bg2:#0a1838;
            --card:rgba(16,32,69,.78);
            --card2:rgba(21,43,88,.86);
            --line:rgba(255,255,255,.11);
            --text:#f5f8ff;
            --muted:#aab8d4;
            --blue:#42a5ff;
            --cyan:#36e0ff;
            --purple:#9b6cff;
            --green:#42e695;
            --yellow:#ffd166;
            --orange:#ff9f43;
            --red:#ff5d73;
            --shadow:0 20px 60px rgba(0,0,0,.38);
            --radius:22px;
        }

        *{box-sizing:border-box}

        html,body{
            margin:0;
            padding:0;
            min-height:100%;
            font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:
                    radial-gradient(circle at 15% 10%,rgba(66,165,255,.16),transparent 28%),
                    radial-gradient(circle at 85% 20%,rgba(155,108,255,.15),transparent 28%),
                    linear-gradient(145deg,var(--bg),var(--bg2));
            color:var(--text);
        }

        body{
            min-height:100vh;
            overflow-x:hidden;
        }

        /* Durante a partida, a tela fica presa ao viewport: sem rolagem. */
        body.game-active{
            overflow:hidden;
        }

        body.game-active .footer{
            display:none;
        }

        button,input{
            font:inherit;
        }

        button{
            cursor:pointer;
        }

        .hidden{
            display:none!important;
        }

        .app{
            min-height:100vh;
            position:relative;
        }

        body.game-active .app{
            height:100dvh;
            min-height:100dvh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        .app::before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            background-image:
                    radial-gradient(circle at 20% 80%,rgba(54,224,255,.05),transparent 22%),
                    radial-gradient(circle at 80% 80%,rgba(155,108,255,.05),transparent 22%);
        }

        .topbar{
            position:sticky;
            top:0;
            z-index:20;
            padding:14px 18px;
            background:rgba(4,12,29,.78);
            backdrop-filter:blur(18px);
            border-bottom:1px solid var(--line);
        }

        .topbar-inner{
            max-width:1200px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:900;
            letter-spacing:.5px;
        }

        .brand-icon{
            width:42px;
            height:42px;
            display:grid;
            place-items:center;
            border-radius:13px;
            background:linear-gradient(135deg,#2b8cff,#8b5cff);
            box-shadow:0 8px 25px rgba(66,165,255,.25);
        }

        .brand span{
            color:#fff;
        }

        .top-actions{
            display:flex;
            gap:7px;
            flex-wrap:wrap;
            justify-content:flex-end;
        }

        .icon-btn{
            border:1px solid var(--line);
            background:rgba(255,255,255,.055);
            color:white;
            border-radius:12px;
            padding:9px 12px;
            transition:.2s;
        }

        .icon-btn:hover{
            background:rgba(255,255,255,.11);
            transform:translateY(-1px);
        }

        main{
            width:min(1200px,calc(100% - 28px));
            margin:auto;
            padding:30px 0 60px;
        }

        body.game-active main{
            width:100%;
            max-width:none;
            flex:1 1 auto;
            min-height:0;
            overflow:hidden;
            padding:12px 18px 14px;
            display:flex;
        }

        .screen{
            animation:fadeIn .25s ease;
        }

        @keyframes fadeIn{
            from{opacity:0;transform:translateY(7px)}
            to{opacity:1;transform:none}
        }

        .hero{
            text-align:center;
            padding:42px 15px 28px;
        }

        .hero-logo{
            width:100px;
            height:100px;
            margin:0 auto 18px;
            border-radius:30px;
            display:grid;
            place-items:center;
            font-size:54px;
            background:linear-gradient(145deg,#208bff,#8056ff);
            box-shadow:
                    0 20px 60px rgba(42,137,255,.24),
                    inset 0 1px 0 rgba(255,255,255,.3);
        }

        .hero h1{
            margin:0;
            font-size:clamp(36px,7vw,70px);
            line-height:.95;
            letter-spacing:-2px;
        }

        .hero h1 span{
            background:linear-gradient(90deg,#4bd8ff,#9d78ff);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }

        .hero p{
            max-width:700px;
            margin:18px auto;
            color:var(--muted);
            font-size:17px;
        }

        .player-pill{
            display:inline-flex;
            align-items:center;
            gap:9px;
            padding:8px 14px;
            border:1px solid rgba(66,165,255,.25);
            background:rgba(66,165,255,.08);
            border-radius:999px;
            color:#dcecff;
            font-weight:700;
        }

        .grid{
            display:grid;
            gap:16px;
        }

        .grid-2{
            grid-template-columns:repeat(2,minmax(0,1fr));
        }

        .grid-3{
            grid-template-columns:repeat(3,minmax(0,1fr));
        }

        .grid-4{
            grid-template-columns:repeat(4,minmax(0,1fr));
        }

        .card{
            background:linear-gradient(145deg,rgba(18,37,78,.84),rgba(8,21,48,.84));
            border:1px solid var(--line);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:22px;
        }

        .card h2,.card h3{
            margin-top:0;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
            margin:20px 0;
        }

        .stat{
            padding:18px;
            border:1px solid var(--line);
            border-radius:18px;
            background:rgba(255,255,255,.035);
        }

        .stat-value{
            font-size:26px;
            font-weight:900;
        }

        .stat-label{
            color:var(--muted);
            font-size:12px;
            margin-top:3px;
        }

        .progress{
            height:9px;
            border-radius:99px;
            background:rgba(255,255,255,.08);
            overflow:hidden;
        }

        .progress > div{
            height:100%;
            border-radius:inherit;
            background:linear-gradient(90deg,var(--blue),var(--purple));
            transition:.4s;
        }

        .actions{
            display:flex;
            flex-wrap:wrap;
            gap:11px;
        }

        .btn{
            border:0;
            border-radius:15px;
            padding:13px 18px;
            color:white;
            font-weight:850;
            transition:.2s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .btn-primary{
            background:linear-gradient(135deg,#168cff,#7657ff);
            box-shadow:0 10px 30px rgba(58,120,255,.22);
        }

        .btn-secondary{
            background:rgba(255,255,255,.07);
            border:1px solid var(--line);
        }

        .btn-success{
            background:linear-gradient(135deg,#20c97a,#36a7d9);
        }

        .btn-warning{
            background:linear-gradient(135deg,#e8a42d,#ff7348);
        }

        .btn-danger{
            background:linear-gradient(135deg,#e64f67,#a92d54);
        }

        .btn-small{
            padding:9px 12px;
            border-radius:11px;
            font-size:13px;
        }

        .section-title{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin:24px 0 14px;
        }

        .section-title h2{
            margin:0;
        }

        .muted{
            color:var(--muted);
        }

        .grade-card,
        .mission-card,
        .difficulty-card{
            position:relative;
            overflow:hidden;
            cursor:pointer;
            transition:.22s;
        }

        .grade-card:hover,
        .mission-card:hover,
        .difficulty-card:hover{
            transform:translateY(-4px);
            border-color:rgba(66,165,255,.4);
        }

        .grade-icon{
            font-size:34px;
            margin-bottom:13px;
        }

        .grade-name{
            font-size:20px;
            font-weight:900;
        }

        .grade-sub{
            color:var(--muted);
            margin-top:5px;
            font-size:14px;
        }

        .locked{
            opacity:.5;
            cursor:not-allowed;
        }

        .locked:hover{
            transform:none;
        }

        .badge{
            display:inline-flex;
            align-items:center;
            gap:5px;
            border-radius:999px;
            padding:5px 9px;
            font-size:11px;
            font-weight:800;
            background:rgba(255,255,255,.08);
            color:#dce6fb;
        }

        .badge-green{background:rgba(66,230,149,.12);color:#6ff0ae}
        .badge-yellow{background:rgba(255,209,102,.12);color:#ffd978}
        .badge-red{background:rgba(255,93,115,.12);color:#ff8394}
        .badge-blue{background:rgba(66,165,255,.12);color:#78bdff}

        .mission-icon{
            font-size:42px;
            margin-bottom:10px;
        }

        .mission-card h3{
            margin-bottom:7px;
        }

        .mission-card p{
            color:var(--muted);
            min-height:42px;
        }

        .mission-meta{
            display:flex;
            justify-content:space-between;
            gap:8px;
            align-items:center;
            margin-top:15px;
        }

        .difficulty-card{
            padding:20px;
        }

        .difficulty-card.selected{
            border-color:#56b8ff;
            box-shadow:0 0 0 2px rgba(66,165,255,.13),var(--shadow);
        }

        .difficulty-icon{
            font-size:28px;
        }

        .difficulty-card strong{
            display:block;
            margin-top:8px;
        }

        .difficulty-card small{
            color:var(--muted);
        }

        .game-screen{
            width:100%;
            height:100%;
            min-height:0;
        }

        body.game-active .game-screen{
            display:flex;
            align-items:stretch;
        }

        .question-wrap{
            width:min(1100px,100%);
            height:100%;
            min-height:0;
            margin:auto;
            display:grid;
            grid-template-rows:auto auto minmax(0,1fr) auto;
            gap:10px;
        }

        .game-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin-bottom:16px;
        }

        .game-head-left{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .game-number{
            font-weight:900;
            font-size:18px;
        }

        .question-card{
            padding:28px;
        }

        body.game-active .question-card{
            min-height:0;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            justify-content:flex-start;
        }

        body.game-active .question{
            margin-bottom:12px;
            font-size:clamp(18px,2.1vw,27px);
            line-height:1.25;
        }

        body.game-active .question-meta{
            margin-bottom:10px;
        }

        body.game-active .options{
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:9px;
            min-height:0;
        }

        body.game-active .option{
            padding:11px 12px;
            min-height:54px;
            align-items:center;
            font-size:clamp(13px,1.35vw,16px);
        }

        body.game-active .option-letter{
            flex-basis:30px;
            width:30px;
            height:30px;
        }

        body.game-active .explanation{
            margin-top:10px;
            padding:11px 13px;
            line-height:1.35;
            font-size:clamp(12px,1.25vw,15px);
            max-height:24vh;
            overflow:auto;
        }

        .question-meta{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-bottom:20px;
        }

        .question{
            font-size:clamp(21px,3.2vw,30px);
            line-height:1.35;
            font-weight:850;
            margin-bottom:25px;
        }

        .options{
            display:grid;
            gap:12px;
        }

        .option{
            display:flex;
            align-items:flex-start;
            gap:12px;
            width:100%;
            text-align:left;
            padding:16px;
            border-radius:16px;
            border:1px solid var(--line);
            background:rgba(255,255,255,.045);
            color:white;
            transition:.18s;
        }

        .option:hover{
            background:rgba(66,165,255,.09);
            border-color:rgba(66,165,255,.35);
        }

        .option-letter{
            flex:0 0 34px;
            width:34px;
            height:34px;
            border-radius:10px;
            display:grid;
            place-items:center;
            font-weight:900;
            background:rgba(255,255,255,.08);
        }

        .option.correct{
            border-color:rgba(66,230,149,.6);
            background:rgba(66,230,149,.12);
        }

        .option.wrong{
            border-color:rgba(255,93,115,.65);
            background:rgba(255,93,115,.12);
        }

        .option.disabled{
            cursor:default;
        }

        .explanation{
            margin-top:18px;
            padding:17px;
            border-radius:15px;
            background:rgba(66,165,255,.07);
            border:1px solid rgba(66,165,255,.18);
            color:#dcecff;
            line-height:1.6;
        }

        .game-bottom{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            margin-top:18px;
        }

        body.game-active .game-bottom{
            margin-top:0;
            min-height:44px;
        }

        body.game-active .game-bottom .btn{
            min-width:150px;
        }

        .combo{
            font-weight:900;
            color:var(--yellow);
        }

        .result{
            text-align:center;
        }

        .medal{
            font-size:80px;
            margin:10px;
        }

        .result-percent{
            font-size:64px;
            font-weight:950;
            line-height:1;
        }

        .result-message{
            color:var(--muted);
            font-size:17px;
            margin:12px auto 22px;
            max-width:650px;
        }

        .achievement{
            padding:16px;
            border:1px solid var(--line);
            border-radius:16px;
            background:rgba(255,255,255,.035);
            text-align:left;
        }

        .achievement.unlocked{
            border-color:rgba(255,209,102,.35);
            background:rgba(255,209,102,.07);
        }

        .achievement-icon{
            font-size:28px;
            float:left;
            margin-right:10px;
        }

        .profile-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .avatar{
            width:70px;
            height:70px;
            border-radius:22px;
            display:grid;
            place-items:center;
            font-size:30px;
            font-weight:950;
            background:linear-gradient(135deg,#1b91ff,#815cff);
        }

        .player-row{
            display:flex;
            align-items:center;
            gap:15px;
            padding:15px;
            border:1px solid var(--line);
            border-radius:17px;
            background:rgba(255,255,255,.035);
            margin-bottom:10px;
        }

        .player-row.current{
            border-color:rgba(66,165,255,.45);
            background:rgba(66,165,255,.08);
        }

        .rank-number{
            width:34px;
            text-align:center;
            font-size:21px;
            font-weight:950;
        }

        .player-info{
            flex:1;
        }

        .player-name{
            font-weight:900;
        }

        .player-details{
            color:var(--muted);
            font-size:12px;
            margin-top:3px;
        }

        .modal{
            position:fixed;
            inset:0;
            z-index:100;
            display:grid;
            place-items:center;
            padding:18px;
            background:rgba(1,6,17,.78);
            backdrop-filter:blur(10px);
        }

        .modal-card{
            width:min(500px,100%);
            background:linear-gradient(145deg,#132a59,#091a3b);
            border:1px solid var(--line);
            border-radius:25px;
            padding:27px;
            box-shadow:0 30px 100px rgba(0,0,0,.55);
        }

        .modal-card h2{
            margin-top:0;
        }

        .input{
            width:100%;
            padding:14px 16px;
            border-radius:14px;
            border:1px solid var(--line);
            background:rgba(255,255,255,.06);
            color:white;
            outline:none;
        }

        .input:focus{
            border-color:rgba(66,165,255,.55);
            box-shadow:0 0 0 3px rgba(66,165,255,.09);
        }

        .form-group{
            margin:16px 0;
        }

        .form-group label{
            display:block;
            font-size:13px;
            color:var(--muted);
            margin-bottom:7px;
        }

        .toast{
            position:fixed;
            z-index:200;
            bottom:22px;
            left:50%;
            transform:translate(-50%,20px);
            opacity:0;
            pointer-events:none;
            padding:13px 18px;
            border-radius:14px;
            background:#122952;
            border:1px solid rgba(66,165,255,.3);
            box-shadow:0 15px 40px rgba(0,0,0,.35);
            transition:.3s;
            font-weight:750;
            max-width:min(500px,90vw);
            text-align:center;
        }

        .toast.show{
            opacity:1;
            transform:translate(-50%,0);
        }

        .confetti{
            position:fixed;
            z-index:150;
            top:-20px;
            width:8px;
            height:14px;
            animation:fall 1.8s linear forwards;
        }

        @keyframes fall{
            to{
                transform:translateY(110vh) rotate(720deg);
                opacity:0;
            }
        }

        .combo-banner{
            position:fixed;
            z-index:140;
            left:50%;
            top:18%;
            transform:translate(-50%,-30px) scale(.8);
            opacity:0;
            pointer-events:none;
            font-size:clamp(26px,6vw,54px);
            font-weight:1000;
            text-shadow:0 10px 40px rgba(0,0,0,.5);
        }

        .combo-banner.show{
            animation:comboPop 1s ease forwards;
        }

        @keyframes comboPop{
            0%{opacity:0;transform:translate(-50%,20px) scale(.7)}
            20%{opacity:1;transform:translate(-50%,0) scale(1.1)}
            75%{opacity:1;transform:translate(-50%,-10px) scale(1)}
            100%{opacity:0;transform:translate(-50%,-50px) scale(.95)}
        }

        .footer{
            text-align:center;
            color:#6f81a3;
            font-size:12px;
            padding:35px 10px;
        }

        .empty{
            padding:30px;
            text-align:center;
            color:var(--muted);
        }

        @media(max-width:850px){
            .grid-4{grid-template-columns:repeat(2,1fr)}
            .grid-3{grid-template-columns:repeat(2,1fr)}
            .stats{grid-template-columns:repeat(2,1fr)}
        }

        @media(max-height:720px) and (min-width:601px){
            body.game-active main{padding:7px 14px 8px}
            body.game-active .question-wrap{gap:6px}
            body.game-active .game-head{margin-bottom:0}
            body.game-active .question{font-size:18px;line-height:1.18;margin-bottom:7px}
            body.game-active .question-meta{margin-bottom:6px}
            body.game-active .option{padding:8px 10px;min-height:44px;font-size:13px}
            body.game-active .option-letter{width:27px;height:27px;flex-basis:27px}
            body.game-active .explanation{max-height:19vh;padding:8px 10px;font-size:12px}
        }

        @media(max-width:600px){
            main{width:min(100% - 18px,1200px);padding-top:18px}

            body.game-active main{
                padding:8px 9px 9px;
            }

            body.game-active .question-wrap{
                gap:7px;
            }

            body.game-active .options{
                grid-template-columns:1fr;
                overflow:auto;
            }

            body.game-active .option{
                min-height:48px;
            }
            .topbar{padding:10px}
            .top-actions .icon-btn{padding:8px 9px}
            .brand span{display:none}
            .hero{padding-top:25px}
            .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
            .stats{grid-template-columns:repeat(2,1fr)}
            .question-card{padding:19px}
            .question{font-size:22px}
            .game-bottom{align-items:stretch;flex-direction:column}
            .actions .btn{flex:1}
        }

        /* =========================================================
           BIOQUEST — JOGO RESPONSIVO REAL
           O jogo ocupa toda a área disponível, sem ficar preso
           no canto ou em uma largura pequena.
           ========================================================= */
        html, body { width:100%; min-width:0; }

        body.game-active,
        body.game-active html {
            width:100vw;
            height:100dvh;
            min-height:100dvh;
            overflow:hidden;
        }

        body.game-active .app {
            width:100vw;
            height:100dvh;
            min-height:100dvh;
            overflow:hidden;
        }

        body.game-active .topbar {
            flex:0 0 auto;
            width:100%;
        }

        body.game-active .topbar-inner {
            width:100%;
            max-width:none;
            padding:0 clamp(4px,1.5vw,24px);
        }

        body.game-active main {
            width:100%;
            max-width:none;
            height:auto;
            flex:1 1 0;
            min-height:0;
            margin:0;
            padding:clamp(6px,1.2vh,16px) clamp(8px,1.5vw,28px);
            display:block;
            overflow:hidden;
        }

        body.game-active .game-screen {
            width:100%;
            height:100%;
            min-height:0;
            margin:0;
            padding:0;
            display:flex;
            align-items:stretch;
            justify-content:center;
        }

        body.game-active .question-wrap {
            width:100%;
            max-width:1600px;
            height:100%;
            min-height:0;
            margin:0 auto;
            display:grid;
            grid-template-rows:auto auto minmax(0,1fr) auto;
            gap:clamp(5px,1vh,12px);
        }

        body.game-active .game-head {
            width:100%;

    function normalizePlayer(p){
        const base = defaultPlayer(p?.name || "Jogador");

        const normalized = {
            ...base,
            ...p,
            id:p?.id || base.id,
            name:String(p?.name || "Jogador").trim().slice(0,30) || "Jogador",
            achievements:Array.isArray(p?.achievements) ? p.achievements : [],

            stats:{
                ...base.stats,
                ...(p?.stats || {})
            },
            last:{
                ...base.last,
                ...(p?.last || {})
            }
        };

        normalized.xp=Math.max(0,Number(normalized.xp)||0);
        normalized.level=calcLevel(normalized.xp);
        normalized.bestCombo=Math.max(0,Number(normalized.bestCombo)||0);

        return normalized;

        try{
            const saved=localStorage.getItem(STORAGE_KEY);

            if(saved){
                const parsed=JSON.parse(saved);

                if(parsed && Array.isArray(parsed.players)){
                    const state={
                        version:43,
                        currentPlayerId:parsed.currentPlayerId || null,
                        players:parsed.players.map(normalizePlayer)
                    };

                    if(!state.currentPlayerId && state.players.length){
                        state.currentPlayerId=state.players[0].id;
                    }

                    return state;
                }
            }

            /* Migração do BioQuest 4 antigo */
            const legacy=localStorage.getItem(LEGACY_KEY);

                return {

            .replaceAll("'","&#039;");

    function playTone(freq=500,duration=.08,type="sine"){
        if(!soundOn)return;

        try{
            const AudioContext=window.AudioContext||window.webkitAudioContext;
            if(!AudioContext)return;

            const ctx=new AudioContext();
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();

            osc.type=type;
            osc.frequency.value=freq;
            gain.gain.setValueAtTime(.035,ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime+duration);
        }catch(e){}
    }

    function validateDatabase(){
        const counts={};

        for(const q of database){
            counts[q.grade]=(counts[q.grade]||0)+1;
        }

        console.log("BioQuest — banco:",database.length,"questões");
        console.table(counts);

        if(database.length!==210){
            console.warn("ATENÇÃO: banco não possui 210 questões.");
        }

        Object.entries(counts).forEach(([grade,count])=>{
            if(count!==30){
                console.warn(`Série ${grade} possui ${count} questões.`);
            }
        });
    }

    function render(){
        document.body.classList.toggle("game-active",screen==="game");
        document.getElementById("soundButton").textContent=soundOn?"🔊":"🔇";

        if(!currentPlayer()){
            showPlayerCreation(true);
            return;
        }

        switch(screen){
            case "home":renderHome();break;
            case "grades":renderGrades();break;
            case "missions":renderMissions();break;
            case "briefing":renderBriefing();break;
            case "game":renderGame();break;
            case "result":renderResult();break;
            case "profile":renderProfile();break;
            case "players":renderPlayers();break;
            case "ranking":renderRanking();break;
            default:renderHome();
        }
    }

    function clearAutoNext(){
        if(autoNextTimer){
            clearTimeout(autoNextTimer);
            autoNextTimer=null;
        }
    }

        screen="home";

    function missionKey(grade,mission){
        return `${grade}|${mission}`;
    }

    function missionProgress(grade,mission){
        const p=currentPlayer();
        const m=p.missions[missionKey(grade,mission)];

        if(!m){
            return {
                attempts:0,
                bestPercent:0,
                completed:false,
                bestMedal:"—",
                xp:0
            };
        }

        return m;
    }

    function isMissionUnlocked(grade,mission){
        const ids=Object.keys(MISSIONS);
        const index=ids.indexOf(mission);

        if(index<=0)return true;

        const previous=ids[index-1];
        return missionProgress(grade,previous).completed;
    }

        const g=GRADES[game.grade];

        document.getElementById("app").innerHTML=`

    /* ============================================================
       ANTI-REPETIÇÃO
       ============================================================ */

    function shuffle(array){
        const arr=[...array];

        for(let i=arr.length-1;i>0;i--){
            const j=Math.floor(Math.random()*(i+1));
            [arr[i],arr[j]]=[arr[j],arr[i]];
        }

        return arr;
    }

    function sample(array,n){
        return shuffle(array).slice(0,n);
    }

    function getPool(grade,mission){
        return database.filter(q=>
            q.grade===grade &&
            q.missions.includes(mission)
        );
    }

    function chooseQuestions(grade,mission,difficulty){
        const p=currentPlayer();
        const key=missionKey(grade,mission);

        let pool=getPool(grade,mission);

        if(pool.length===0){
            return [];
        }

        let used=Array.isArray(p.usedQuestions[key])
            ? p.usedQuestions[key]
            : [];

        let available=pool.filter(q=>!used.includes(q.id));

        let cycleReset=false;

        /*
        Se não há nenhuma questão disponível,
        o ciclo inteiro daquela série + missão é resetado.
        */
        if(available.length===0){
            used=[];
            p.usedQuestions[key]=[];
            available=[...pool];
            cycleReset=true;
        }

        let selected=[];

        if(difficulty==="mixed"){
            selected=sample(available,Math.min(5,available.length));
        }else{
            const requested=available.filter(q=>q.difficulty===difficulty);
            const other=available.filter(q=>q.difficulty!==difficulty);

            selected=[
                ...sample(requested,Math.min(5,requested.length))
            ];

            if(selected.length<5){
                const remaining=other.filter(q=>!selected.some(s=>s.id===q.id));
                selected.push(
                    ...sample(remaining,5-selected.length)
                );
            }
        }

        /*
        Se ainda houver menos de 5 questões porque o banco
        disponível é menor que 5, usamos todas as restantes.
        Não há repetição dentro da sessão.
        */
        selected=shuffle(selected).slice(0,5);

        /*
        Registra imediatamente as questões escolhidas.
        Assim, mesmo se o jogador abandonar a partida,
        elas não reaparecem imediatamente.
        */
        const newIds=selected.map(q=>q.id);

        p.usedQuestions[key]=[
            ...new Set([
                ...used,
                ...newIds
            ])
        ];

        p.updatedAt=Date.now();

        saveApp();

        if(cycleReset){
            showToast("🔄 Banco concluído — novo ciclo iniciado!");
        }

        return selected;
    }

    function beginGame(){
        const questions=chooseQuestions(
            game.grade,
            game.mission,
            game.difficulty
        );

        if(!questions.length){
            showToast("Não há questões disponíveis para esta missão.");
            return;
        }

        game.questions=questions;
        game.index=0;
        game.correct=0;
        game.wrong=0;
        game.combo=0;
        game.bestCombo=0;
        game.score=0;
        game.answered=false;

        p.last={
            grade:game.grade,
            mission:game.mission,
            difficulty:game.difficulty
        };

        saveApp();

        screen="game";
        render();
    }

    function answerQuestion(index){
        if(game.answered)return;

        game.answered=true;

        const q=game.questions[game.index];
        const correct=index===q.answer;

        const buttons=[...document.querySelectorAll(".option")];

        buttons.forEach((button,i)=>{
            button.classList.add("disabled");
            button.disabled=true;

            if(i===q.answer){
                button.classList.add("correct");
            }

            if(i===index && !correct){
                button.classList.add("wrong");
            }
        });

        const p=currentPlayer();

        p.stats.answered++;

        let gained=0;

        if(correct){
            game.correct++;
            game.combo++;

            game.bestCombo=Math.max(game.bestCombo,game.combo);
            p.bestCombo=Math.max(p.bestCombo,game.combo);

            gained=20;

            if(q.difficulty==="medium")gained+=5;
            if(q.difficulty==="hard")gained+=10;

            if(game.combo>=3)gained+=5;
            if(game.combo>=5)gained+=10;
            if(game.combo>=10)gained+=20;

            game.score+=gained;

            p.stats.correct++;

            playTone(700,.1);

            if(game.combo>=3){
                showComboBanner(`🔥 COMBO ${game.combo}!`);
            }

            if(game.combo>=5){
                showComboBanner("⚡ COMBO INSANO!");
            }

        }else{
            game.wrong++;
            game.combo=0;

            playTone(180,.13,"square");
        }

        addXP(gained);

        document.getElementById("answerArea").innerHTML=`
        <div class="explanation">
            <strong>
                ${correct?"✅ Resposta correta!":"❌ Não foi dessa vez."}
            </strong>

            <div style="margin-top:7px">
                <strong>Resposta:</strong>
                ${LETTERS[q.answer]}) ${escapeHTML(q.options[q.answer])}
            </div>

            <div style="margin-top:9px">
                ${escapeHTML(q.explanation)}
            </div>

            ${
            gained
                ? `<div style="margin-top:10px;color:var(--yellow);font-weight:900">
                    +${gained} XP
                   </div>`
                : ""
        }
        </div>
    `;

        document.getElementById("nextButton").classList.remove("hidden");

        checkAchievements();
        saveApp();

        // Avança automaticamente após alguns segundos, mas o jogador
        // pode clicar em PRÓXIMA imediatamente se preferir.
        clearAutoNext();
        autoNextTimer=setTimeout(()=>{
            if(screen==="game" && game.answered){
                nextQuestion();
            }
        },3500);
    }

    function nextQuestion(){
        clearAutoNext();
        if(!game.answered)return;

        if(game.index<game.questions.length-1){
            game.index++;
            game.answered=false;
            render();
        }else{
            finishGame();
        }
    }

    function finishGame(){
        const p=currentPlayer();

        const total=game.questions.length;
        const percent=Math.round((game.correct/total)*100);

        let bonus=0;

        if(percent===100)bonus+=50;
        else if(percent>=90)bonus+=30;
        else if(percent>=75)bonus+=20;
        else if(percent>=60)bonus+=10;

        if(game.bestCombo>=5)bonus+=15;

        if(bonus){
            addXP(bonus);
        }

        p.stats.games++;

        const key=missionKey(game.grade,game.mission);

        if(!p.missions[key]){
            p.missions[key]={
                attempts:0,
                bestPercent:0,
                completed:false,
                bestMedal:"—",
                xp:0
            };
        }

        const m=p.missions[key];

        m.attempts++;
        m.xp+=game.score+bonus;

        if(percent>m.bestPercent){
            m.bestPercent=percent;
            m.bestMedal=medalFor(percent);
        }

        if(percent>=60){
            m.completed=true;
        }

        p.updatedAt=Date.now();

        checkAchievements();

        saveApp();

        if(percent>=90){
            confetti();
        }

        screen="result";
        render();
    }

    function checkAchievements(){
        const p=currentPlayer();
        if(!p)return;

        for(const achievement of ACHIEVEMENTS){
            if(p.achievements.includes(achievement.id))continue;

            let unlocked=false;

            try{
                unlocked=achievement.check(p);
            }catch(e){
                unlocked=false;
            }

            if(unlocked){
                p.achievements.push(achievement.id);
                showToast(`🏅 Conquista desbloqueada: ${achievement.title}`);
                playTone(850,.18);
            }
        }

        saveApp();
    }

        }

        const duplicate=appState.players.some(
            p=>p.name.toLowerCase()===name.toLowerCase()
        );

        if(duplicate){
            showToast("Já existe um jogador com esse nome.");
            return;
        }

        const player=defaultPlayer(name);

        appState.players.push(player);
        appState.currentPlayerId=player.id;

        saveApp();
        closeModal();

        screen="home";
        render();

        showToast(`👋 Bem-vindo, ${player.name}!`);
    }

    function switchPlayer(id){
        const player=appState.players.find(p=>p.id===id);

        if(!player)return;

        appState.currentPlayerId=id;

        game={
            grade:null,
            mission:null,
            difficulty:"mixed",
            questions:[],
            index:0,
            correct:0,
            wrong:0,
            combo:0,
            bestCombo:0,
            score:0,
            answered:false
        };

        saveApp();

        screen="home";
        render();

        showToast(`👤 Jogador atual: ${player.name}`);
    }

    function renameCurrentPlayer(){
        const p=currentPlayer();

        if(!p)return;

        renamePlayer(p.id);
    }

    function renamePlayer(id){
        const p=appState.players.find(player=>player.id===id);

        if(!p)return;

        const modal=document.getElementById("modal");

        modal.classList.remove("hidden");

        modal.innerHTML=`
        <div class="modal-card">

            <div style="font-size:40px">✏️</div>

            <h2>Editar nome</h2>

            <p class="muted">
                O progresso deste jogador será preservado.
            </p>

            <div class="form-group">
                <label>Novo nome</label>

                <input
                    id="renameInput"
                    class="input"
                    maxlength="30"
                    value="${escapeHTML(p.name)}"
                    autocomplete="off"
                >
            </div>

            <div class="actions">
                <button class="btn btn-primary"
                        onclick="confirmRename('${p.id}')">
                    SALVAR
                </button>

                <button class="btn btn-secondary"
                        onclick="closeModal()">
                    CANCELAR
                </button>
            </div>

        </div>
    `;

        setTimeout(()=>{
            const input=document.getElementById("renameInput");
            input?.focus();
            input?.select();
        },50);
    }

    function confirmRename(id){
        const p=appState.players.find(player=>player.id===id);
        const input=document.getElementById("renameInput");

        if(!p||!input)return;

        const name=input.value.trim();

        if(!name){
            showToast("Digite um nome válido.");
            return;
        }

        const duplicate=appState.players.some(
            player=>
                player.id!==id &&
                player.name.toLowerCase()===name.toLowerCase()
        );

        if(duplicate){
            showToast("Já existe outro jogador com esse nome.");
            return;
        }

        p.name=name.slice(0,30);
        p.updatedAt=Date.now();

        saveApp();
        closeModal();
        render();

        showToast("Nome atualizado.");
    }

    function deletePlayer(id){
        const p=appState.players.find(player=>player.id===id);

        if(!p)return;

        if(appState.players.length<=1){
            showToast("É necessário manter pelo menos um jogador.");
            return;
        }

        const confirmed=confirm(
            `Excluir o jogador "${p.name}"?\n\n`+
            `Todo o progresso, XP, conquistas e histórico desse jogador serão apagados.`
        );

        if(!confirmed)return;

        appState.players=appState.players.filter(player=>player.id!==id);

        if(appState.currentPlayerId===id){
            appState.currentPlayerId=appState.players[0].id;
        }

        saveApp();

        screen="players";
        render();

        showToast("Jogador excluído.");
    }

    /* ============================================================
       RANKING
       ============================================================ */

    function showRanking(){
        screen="ranking";
        render();
    }

    function renderRanking(){
        const players=[...appState.players]
            .sort((a,b)=>{
                if(b.xp!==a.xp)return b.xp-a.xp;
                return b.bestCombo-a.bestCombo;
            });

        document.getElementById("app").innerHTML=`
        <section class="screen">

            <div class="section-title">
                <div>
                    <h1>🏆 Ranking dos Jogadores</h1>
                    <p class="muted">
                        Uma competição saudável baseada em conhecimento.
                    </p>
                </div>

                <button class="btn btn-secondary" onclick="goHome()">← Início</button>
            </div>

            <div class="card">

                ${
            players.length
                ? players.map((p,index)=>{
                    const position=index+1;

                    let medal="";

                    if(position===1)medal="🥇";
                    else if(position===2)medal="🥈";
                    else if(position===3)medal="🥉";
                    else medal=`${position}º`;

                    return `
                        <div class="player-row ${p.id===appState.currentPlayerId?"current":""}">

                            <div class="rank-number">
                                ${medal}
                            </div>

                            <div class="avatar"
                                 style="width:48px;height:48px;border-radius:15px;font-size:18px">
                                ${initials(p.name)}
                            </div>

                            <div class="player-info">
                                <div class="player-name">
                                    ${escapeHTML(p.name)}

                                    ${
                        p.id===appState.currentPlayerId
                            ? `<span class="badge badge-green" style="margin-left:7px">
                                            VOCÊ
                                           </span>`
                            :""
                    }
                                </div>

                                <div class="player-details">
                                    Nível ${p.level} •
                                    ${p.stats.games} partidas •
                                    Melhor combo ${p.bestCombo}
                                </div>
                            </div>

                            <div style="text-align:right">
                                <strong style="font-size:20px">
                                    ${p.xp}
                                </strong>

                                <div class="muted" style="font-size:11px">
                                    XP
                                </div>
                            </div>

                        </div>
                        `;
                }).join("")
                : `<div class="empty">Nenhum jogador cadastrado.</div>`
        }

            </div>

            <div class="card" style="margin-top:16px">
                <strong>🎯 O que determina a posição?</strong>

                <p class="muted">
                    O ranking é ordenado primeiro pelo XP total.
                    Em caso de empate, o melhor combo desempata.
                </p>

                <span class="badge badge-blue">
                    Ranking local • Este dispositivo
                </span>
            </div>

        </section>
    `;
    }

    /* ============================================================
       CONTROLES DE DADOS
       ============================================================ */

    function resetQuestionHistory(){
        const p=currentPlayer();

        if(!p)return;

        const confirmed=confirm(
            `Zerar o histórico de questões de ${p.name}?\n\n`+
            `Isso NÃO apagará XP, medalhas, conquistas ou missões concluídas.`
        );

        if(!confirmed)return;

        p.usedQuestions={};
        p.updatedAt=Date.now();

        saveApp();
        render();

        showToast("🧹 Histórico de questões zerado.");
    }

    function resetPlayerProgress(){
        const p=currentPlayer();

        if(!p)return;

        const confirmed=confirm(
            `ZERAR TODO O PROGRESSO de ${p.name}?\n\n`+
            `XP, nível, medalhas, conquistas, estatísticas e missões serão apagados.\n`+
            `O nome do jogador será mantido.`
        );

        if(!confirmed)return;

        const name=p.name;
        const id=p.id;
        const createdAt=p.createdAt;

        const fresh=defaultPlayer(name);

        fresh.id=id;
        fresh.createdAt=createdAt;

        const index=appState.players.findIndex(player=>player.id===id);

        appState.players[index]=fresh;
        appState.currentPlayerId=id;

        saveApp();

        screen="home";
        render();

        showToast("⚠️ Progresso zerado.");
    }

    /* ============================================================
       EFEITOS
       ============================================================ */

    function showComboBanner(text){
        const el=document.getElementById("comboBanner");

        el.textContent=text;
        el.classList.remove("show");

        void el.offsetWidth;

        el.classList.add("show");
    }

    function confetti(){
        for(let i=0;i<70;i++){
            const el=document.createElement("div");

            el.className="confetti";
            el.style.left=Math.random()*100+"vw";
            el.style.animationDelay=Math.random()*.8+"s";
            el.style.transform=`rotate(${Math.random()*360}deg)`;

            document.body.appendChild(el);

            setTimeout(()=>{
                el.remove();
            },2300);
        }
    }

    /* ============================================================
       TECLADO
       ============================================================ */

    document.addEventListener("keydown",event=>{
        if(screen!=="game")return;

        if(game.answered){
            if(event.key==="Enter" || event.key===" "){
                event.preventDefault();
                nextQuestion();
            }
            return;
        }

        const key=event.key.toLowerCase();

        const map={
            a:0,
            b:1,
            c:2,
            d:3,
            "1":0,
            "2":1,
            "3":2,
            "4":3
        };

        if(map[key]!==undefined){
            answerQuestion(map[key]);
        }
    });

    /* ============================================================
       MODAL
       ============================================================ */

    function closeModal(){
        document.getElementById("modal").classList.add("hidden");
        document.getElementById("modal").innerHTML="";
    }

    /* ============================================================
       INICIALIZAÇÃO
       ============================================================ */

    validateDatabase();

    if(!appState.players.length){
        showPlayerCreation(true);
    }else{
        render();
    }

</script>

</body>
</html>
